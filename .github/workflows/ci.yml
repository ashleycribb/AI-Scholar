name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Bun is used only as the test runner (`npm test` -> `bun test`); dependencies come from package-lock.json via npm.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.x

      - name: Install (lockfile must be in sync)
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Tests
        run: npm test

      - name: Build web app and server
        run: npm run build

      - name: Build browser extension
        run: npm run build-extension
