    /* Custom Scrollbar Styles for a more modern look */

    /* For Firefox */
    html {
      scrollbar-width: thin;
      scrollbar-color: #94a3b8 #f1f5f9; /* thumb color, track color */
    }
    
    /* For Webkit-based browsers (Chrome, Safari, Edge) */
    ::-webkit-scrollbar {
      width: 10px;
      height: 10px;
    }

      background-color: #94a3b8; /* slate-400 */

    }

    }
