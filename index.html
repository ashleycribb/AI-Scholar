
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scholar Explorer</title>
    <meta name="description" content="An AI-powered assistant to help doctoral students and researchers find and summarize relevant academic papers, providing concise summaries and source links." />
    <meta property="og:title" content="Scholar Explorer" />
    <meta property="og:description" content="An AI-powered assistant to help doctoral students and researchers find and summarize relevant academic papers, providing concise summaries and source links." />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
      /* Keep only critical layout styles if necessary, or move all to index.css */
    </style>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              border: 'hsl(var(--border))',
              input: 'hsl(var(--input))',
              ring: 'hsl(var(--ring))',
              background: 'hsl(var(--background))',
              foreground: 'hsl(var(--foreground))',
              primary: {
                DEFAULT: 'hsl(var(--primary))',
                foreground: 'hsl(var(--primary-foreground))',
              },
              secondary: {
                DEFAULT: 'hsl(var(--secondary))',
                foreground: 'hsl(var(--secondary-foreground))',
              },
              destructive: {
                DEFAULT: 'hsl(var(--destructive))',
                foreground: 'hsl(var(--destructive-foreground))',
              },
              muted: {
                DEFAULT: 'hsl(var(--muted))',
                foreground: 'hsl(var(--muted-foreground))',
              },
              accent: {
                DEFAULT: 'hsl(var(--accent))',
                foreground: 'hsl(var(--accent-foreground))',
              },
              popover: {
                DEFAULT: 'hsl(var(--popover))',
                foreground: 'hsl(var(--popover-foreground))',
              },
              card: {
                DEFAULT: 'hsl(var(--card))',
                foreground: 'hsl(var(--card-foreground))',
              },
            },
            borderRadius: {
              lg: `var(--radius)`,
              md: `calc(var(--radius) - 2px)`,
              sm: 'calc(var(--radius) - 4px)',
            },
          },
        },
      }
    </script>
    <link rel="stylesheet" href="/index.css">
  </head>
  <body class="bg-background text-foreground">
    <div id="root"></div>
    <script src="https://cdn.jsdelivr.net/npm/@citation-js/core@0.7.8/dist/core.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@citation-js/plugin-csl@0.7.8/dist/plugin-csl.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@citation-js/plugin-ris@0.7.8/dist/plugin-ris.min.js"></script>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
